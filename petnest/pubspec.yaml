name: petnest
description: "PetNest - pet care app for pet owners and vets (Flutter port of the Compose app)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^7.1.0
  file_picker: ^13.3.2
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  go_router: ^18.1.2
  google_sign_in: ^7.2.0
  material_ui: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
